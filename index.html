<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>IA_OFFICE_ASSISTANT - By MASTER S.</title>
<style>
:root{--azul:#0a1628;--azul-medio:#1a2b48;--azul-claro:#2a3f5f;--fondo:#f3f2f1;--blanco:#fff;--texto:#222;--gris:#e2e2d2}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,Segoe UI,Calibri,Arial,sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,var(--azul) 0%,var(--azul-medio) 60%,#0d2137 100%);color:var(--blanco);padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
header::before{content:"";position:absolute;top:-50%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(0,212,255,.15) 0%,transparent 70%);border-radius:50%}
.logo-wrap{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo-svg{width:48px;height:48px;filter:drop-shadow(0 0 8px rgba(0,212,255,.4))}
.titulos{display:flex;flex-direction:column}
.titulos h1{font-size:20px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;line-height:1.1;color:var(--blanco)}
.titulos small{font-size:11px;color:#00d4ff;margin-top:3px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.barra-navegacion{display:flex;gap:6px;padding:10px;background:var(--gris);flex-wrap:wrap;align-items:center;border-bottom:1px solid #bbb}
.barra-navegacion button{padding:8px 12px;border-radius:5px;border:1px solid #bbb;cursor:pointer;font-size:14px;background:#fff}
.barra-navegacion button:active{transform:scale(.97)}
.btn-primario{background:var(--azul-medio)!important;color:var(--blanco)!important;border-color:var(--azul-medio)!important}
.modo-tabs{display:flex;background:#d5d5d5;padding:6px 10px 0;gap:4px}
.modo-tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:600;background:#c0c0c0;border:none;border-radius:6px 6px 0 0;cursor:pointer}
.modo-tab.activo{background:var(--blanco);color:var(--azul-medio);border-bottom:2px solid var(--azul-medio)}
.area-trabajo{padding:12px;flex:1;display:flex;flex-direction:column;overflow:hidden}
.editor-wrap{background:var(--blanco);border:1px solid #ccc;border-radius:6px;flex:1;display:flex;flex-direction:column;overflow:hidden}
.editor-toolbar{display:flex;gap:4px;padding:8px;background:#fafafa;border-bottom:1px solid #e0e0e0;flex-wrap:wrap;align-items:center}
.editor-toolbar button{width:34px;height:34px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer}
#editor{flex:1;padding:14px;font-size:17px;line-height:1.7;outline:none;overflow-y:auto;min-height:180px}
.barra-envio{display:flex;gap:8px;margin-top:10px}
.barra-envio input{flex:1;padding:12px 14px;border-radius:6px;border:1px solid #ccc;font-size:15px;outline:none}
.barra-envio input:focus{border-color:var(--azul-medio)}
.barra-envio button{padding:12px 22px;border-radius:6px;border:none;background:var(--azul-medio);color:#fff;font-size:15px;cursor:pointer}
.estado{margin-top:10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#eee;border-radius:6px}
.estado.ok{color:#0a7}
.estado.error{color:#d43}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.estado.ok.dot{background:#4caf50;box-shadow:0 0 6px #4caf50}
.estado.error.dot{background:#f44336}
.panel-respuesta{margin-top:10px;padding:12px;background:#fff;border-radius:6px;min-height:80px;border:1px solid #ddd;font-size:14px;max-height:300px;overflow-y:auto}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 20px;border-radius:20px;opacity:0;transition:.3s;z-index:9999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
