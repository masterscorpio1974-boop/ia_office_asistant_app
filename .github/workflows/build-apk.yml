name: Build IA_OFFICE_ASSISTANT APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar icon y www
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          echo "Archivos en la carpeta:"
          ls -lh ia_office_asistant_app/
          # Convierte JPG a PNG si existe
          if [ -f "ia_office_asistant_app/icon.jpg" ]; then
            convert ia_office_asistant_app/icon.jpg ia_office_asistant_app/icon.png
            echo "JPG convertido a PNG"
          fi
          if [ ! -f "ia_office_asistant_app/icon.png" ]; then
            echo "ERROR: no hay icon.png ni icon.jpg"
            exit 1
          fi
          mkdir -p www
          cp ia_office_asistant_app/index.html www/index.html || cp index.html www/index.html
          cp ia_office_asistant_app/icon.png www/icon.png || true
          ls -lh www/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          npm install
          npm run build || true
          npx cap add android || true
          npx cap copy android
          npx cap sync android
          # Iconos con margen 280x280 para que tu S no se corte
          for dir in hdpi mdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android/app/src/main/res/mipmap-${dir}; done
          convert ia_office_asistant_app/icon.png -resize 280x280 -gravity center -extent 512x512 -background black android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert ia_office_asistant_app/icon.png -resize 280x280 -gravity center -extent 512x512 -background black android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: IA_OFFICE_ASSISTANT-APK
          path: android/app/build/outputs/apk/debug/*.apk
