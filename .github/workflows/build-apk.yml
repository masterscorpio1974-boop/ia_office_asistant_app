name: Build IA_OFFICE_ASSISTANT APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar icon y www
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          ls -lh
          ICON_SRC=""
          if [ -f "icon.jpg" ]; then ICON_SRC="icon.jpg"; fi
          if [ -f "icon.png" ]; then ICON_SRC="icon.png"; fi
          if [ -f "ia_office_asistant_app/icon.jpg" ]; then ICON_SRC="ia_office_asistant_app/icon.jpg"; fi
          if [ -f "ia_office_asistant_app/icon.png" ]; then ICON_SRC="ia_office_asistant_app/icon.png"; fi
          echo "Icono encontrado: $ICON_SRC"
          if [ -z "$ICON_SRC" ]; then echo "No hay icono!" && exit 1; fi
          convert "$ICON_SRC" icon.png
          mkdir -p www
          if [ -f "index.html" ]; then cp index.html www/index.html; elif [ -f "ia_office_asistant_app/index.html" ]; then cp ia_office_asistant_app/index.html www/index.html; fi
          cp icon.png www/icon.png
          ls -lh www/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Configurar reintentos Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.network.retry.max.attempts=5" >> ~/.gradle/gradle.properties
          echo "org.gradle.network.retry.initial.backOff=1000" >> ~/.gradle/gradle.properties
          echo "org.gradle.internal.http.socketTimeout=60000" >> ~/.gradle/gradle.properties

      - name: Build APK
        run: |
          npm install
          npm run build || true
          npx cap add android || true
          npx cap copy android
          npx cap sync android
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android/app/src/main/res/mipmap-$d; done
          convert
