name: Build IA_OFFICE_LOCAL APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm install @capacitor/core @capacitor/cli @capacitor/android || true
      - name: Build Web
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp icon.png www/icon.png 2>/dev/null || cp icon.jpg www/icon.png 2>/dev/null || cp ia_office_asistant_app/icon.jpg www/icon.png 2>/dev/null || cp ia_office_asistant_app/icon.png www/icon.png 2>/dev/null || true
          cp manifest.json www/manifest.json 2>/dev/null || true
          cp sw.js www/sw.js 2>/dev/null || true
          cp capacitor.config.json capacitor.config.json || echo '{"appId":"com.masters.iaofficelocal","appName":"OFFICE_VERDE","webDir":"www"}' > capacitor.config.json
          npx cap add android || true
          npx cap copy android
      - name: Icono VERDE y Splash
        run: |
          ICON=$(find . -maxdepth 3 -type f \( -iname "icon.png" -o -iname "icon.jpg" \) | head -1)
          echo "Icono encontrado: $ICON"
          for d in android/app/src/main/res/mipmap-* android/app/src/main/res/drawable*; do [ -d "$d" ] && cp "$ICON" "$d/ic_launcher.png" && cp "$ICON" "$d/ic_launcher_round.png" || true; done
      - name: Build APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IA_OFFICE_LOCAL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
