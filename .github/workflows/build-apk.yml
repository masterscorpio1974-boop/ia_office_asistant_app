name: Build IA_OFFICE_LOCAL APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Build Web LIMPIO
        run: |
          rm -rf android www
          mkdir -p www
          cp index.html www/index.html
          cp icon.jpg www/icon.png 2>/dev/null || cp icon.png www/icon.png 2>/dev/null || true
          cp manifest.json www/manifest.json 2>/dev/null || true
          cp sw.js www/sw.js 2>/dev/null || true
          echo '{"appId":"com.masters.iaofficelocal","appName":"OFFICE_VERDE","webDir":"www"}' > capacitor.config.json
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml
          ICON="www/icon.png"
          for d in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do [ -d "$d" ] && cp "$ICON" "$d/ic_launcher.png" && cp "$ICON" "$d/ic_launcher_round.png" || true; done
          npx cap copy android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OFFICE_VERDE-OFFLINE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
