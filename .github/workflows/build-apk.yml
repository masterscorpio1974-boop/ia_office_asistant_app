name: Build IA_OFFICE_ASSISTANT APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar icon y www
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pwd
          ls -lh
          # Busca el icono donde esté (raiz o carpeta)
          ICON_SRC=""
          if [ -f "icon.jpg" ]; then ICON_SRC="icon.jpg"; fi
          if [ -f "icon.png" ]; then ICON_SRC="icon.png"; fi
          if [ -f "ia_office_asistant_app/icon.jpg" ]; then ICON_SRC="ia_office_asistant_app/icon.jpg"; fi
          if [ -f "ia_office_asistant_app/icon.png" ]; then ICON_SRC="ia_office_asistant_app/icon.png"; fi
          echo "Icono encontrado: $ICON_SRC"
          if [ -z "$ICON_SRC" ]; then echo "No hay icono!" && exit 1; fi
          # Convierte a icon.png en raiz
          convert "$ICON_SRC" icon.png
          mkdir -p www
          cp index.html www/index.html || cp ia_office_asistant_app/index.html www/index.html || true
          cp icon.png www/icon.png
          ls -lh www/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          npm install
          npm run build || true
          npx cap add android || true
          npx cap copy android
          npx cap sync android
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android/app/src/main/res/mipmap-$d; done
          convert icon.png -resize 280x280 -gravity center -extent 512x512 -background black android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 280x280 -gravity center -extent 512x512 -background black android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          for d in mdpi xhdpi xxhdpi xxxhdpi; do cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png; cp android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: IA_OFFICE_ASSISTANT-APK
          path: android/app/build/outputs/apk/debug/*.apk
